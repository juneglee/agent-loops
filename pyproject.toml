[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-loops"
version = "0.1.0"
description = "Agent loops from papers on one interface, compared on the same model"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["requests"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
bench = ["bfcl-eval", "soundfile"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: 실제 모델 서버와 공식 채점기가 필요한 테스트",
    "slow: 1분 이상 걸리는 데이터셋 앵커",
]

[tool.ruff]
target-version = "py310"
